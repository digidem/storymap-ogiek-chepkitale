    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a,
      a:hover,
      a:visited {
        color: #0071bc;
      }

      #map {
        top: 0;
        height: 100vh;
        width: 100vw;
        position: fixed;
      }

      #mapInset {
        bottom: 50px;
        right: 30px;
        height: 180px;
        width: 250px;
        max-width: 100%;
        position: fixed;
        z-index: 1;
        opacity: 1;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
      }

      #header {
        box-sizing: border-box;
        margin: 16vh auto 68vh;
        width: min(34rem, calc(100% - 2rem));
        padding: 1.5rem 1.7rem 1.15rem;
        position: relative;
        z-index: 5;
        text-align: center;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      }

      #header h1,
      #header h2,
      #header p {
        margin: 0;
        padding: 0;
      }

      #header h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: clamp(1.35rem, 2.2vw, 1.75rem);
        font-weight: 600;
        line-height: 1.22;
        letter-spacing: -0.015em;
      }

      #header h2 {
        margin-top: 0.7rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      #header > img {
        width: 5.25rem;
        margin-top: 0.85rem;
      }

      #header p#terrain-tip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin-top: 0.75rem;
        font-size: 0.82rem;
        line-height: 1.35;
        font-style: italic;
        text-align: left;
      }

      #terrain-tip svg {
        flex: none;
        width: 1.85rem;
        height: 1.85rem;
      }

      #footer {
        box-sizing: border-box;
        width: min(22.5rem, calc(100% - 2rem));
        margin: 0 0 16vh 1.75rem;
        padding: 0.9rem 1.15rem;
        text-align: left;
        line-height: 1.45;
        font-size: 0.82rem;
        border-radius: 12px;
        position: relative;
        z-index: 5;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      #footer p {
        margin: 0;
      }

      #footer a {
        color: #fff;
      }

      #features {
        padding-top: 10vh;
        padding-bottom: 10vh;
      }

      .hidden {
        visibility: hidden;
      }

      .centered {
        width: min(28rem, 88vw);
        margin: 0 auto;
      }

      .lefty {
        width: min(22.5rem, 88vw);
        margin-left: 1.75rem;
      }

      .righty {
        width: min(22.5rem, 88vw);
        margin-left: auto;
        margin-right: 1.75rem;
      }

      .fully {
        width: 100%;
        margin: auto;
      }

      .light {
        color: #242424;
        background-color: rgba(250, 250, 250, 0.94);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      .dark {
        color: #f4f1ea;
        background-color: rgba(22, 24, 28, 0.9);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }

      /* Stay above fixed legends. A flat z-index loses to backdrop-filter on mobile. */
      #header,
      #footer,
      .step,
      .light,
      .dark {
        isolation: isolate;
        transform: translateZ(0);
      }

      .step {
        position: relative;
        z-index: 5;
        padding-bottom: 42vh;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .step.active {
        opacity: 1;
      }

      .step div {
        box-sizing: border-box;
        padding: 1.05rem 1.15rem 0.95rem;
        line-height: 1.5;
        font-size: 0.98rem;
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .step h3 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.28rem;
        font-weight: 600;
        line-height: 1.25;
        margin: 0 0 0.65rem;
      }

      .step p {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 0.98rem;
        line-height: 1.5;
        margin: 0.7rem 0 0;
      }

      .step .caption {
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-size: 0.78rem;
        line-height: 1.4;
        opacity: 0.82;
        margin-top: 0.4rem;
      }

      .step div a {
        color: inherit;
        text-underline-offset: 2px;
      }

      .step img {
        width: 100%;
        display: block;
        border-radius: 6px;
      }

      #rotate-mobile {
        display: none;
        max-width: 100%;
      }

      #rotate-mobile img {
        display: block;
        width: 2.5rem;
        height: auto;
        margin: 0.55rem auto 0;
      }

      .legend {
        box-sizing: border-box;
        position: fixed;
        right: 30px;
        bottom: 58px;
        color: #444;
        background-color: #fafafa;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        padding: 10px;
        display: none;
        z-index: 1;
        max-width: min(350px, calc(100% - 1.5rem));
      }

      .legend img {
        width: 25px;
        margin-right: 10px;
      }

      .legend h3 {
        margin: 0 0 10px;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
      }

      .legend div {
        vertical-align: center;
      }

      .legend div #block {
        display: inline-block;
        height: 20px;
        width: 30px;
        margin-right: 5px;
      }

      .legend div #text {
        vertical-align: top;
      }

      .maplibregl-ctrl {
        margin-right: 30px !important;
      }

      .maplibregl-ctrl-top-right {
        z-index: 2;
      }

      .maplibregl-popup {
        font:
          12px/20px "Source Sans 3",
          "Segoe UI",
          sans-serif;
      }

      @media (max-width: 750px) {
        #header {
          width: min(34rem, calc(100% - 1.25rem));
          margin: 4vh auto 32vh;
          padding: 0.95rem 0.9rem 0.8rem;
        }

        #header h1 {
          font-size: clamp(1.12rem, 4.8vw, 1.35rem);
        }

        #header h2 {
          margin-top: 0.4rem;
          font-size: 0.84rem;
          line-height: 1.3;
        }

        #header > img {
          width: 3.5rem;
          margin-top: 0.5rem;
        }

        #header p#terrain-tip {
          margin-top: 0.5rem;
          font-size: 0.78rem;
        }

        .step div {
          padding: 0.9rem 0.95rem 0.8rem;
        }

        .step h3 {
          font-size: 1.12rem;
        }

        #footer {
          width: min(22.5rem, calc(100% - 1.25rem));
          margin: 0 auto 12vh;
        }

        #rotate-mobile {
          display: block;
          margin-top: 0.7rem;
          font-size: 0.8rem;
          line-height: 1.35;
        }

        .legend {
          right: 0.75rem;
          bottom: 0.75rem;
          padding: 8px;
          font-size: 0.78rem;
        }

        .centered,
        .lefty,
        .righty,
        .fully {
          width: min(36rem, calc(100% - 1.25rem));
          margin-left: auto;
          margin-right: auto;
        }
      }

      #scroll-cue {
        position: fixed;
        left: 50%;
        bottom: max(1.35rem, env(safe-area-inset-bottom));
        z-index: 6;
        width: 2.4rem;
        margin-left: -1.2rem;
        pointer-events: none;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
        animation: scroll-cue 1.5s ease-in-out infinite;
      }

      #scroll-cue.is-gone {
        animation: scroll-cue-out 0.35s ease forwards;
      }

      @keyframes scroll-cue {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        50% {
          transform: translateY(0.55rem);
          opacity: 1;
        }
      }

      @keyframes scroll-cue-out {
        to {
          opacity: 0;
          transform: translateY(0.7rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #scroll-cue {
          animation: none;
          opacity: 0.9;
        }
      }

      /* Fix issue on mobile browser where scroll breaks  */
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
      .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan
        .maplibregl-canvas {
        touch-action: unset;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <div id="mapInset"></div>
    <div id="story"></div>
    <div id="scroll-cue" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M5 8.5 12 15.5 19 8.5"
          fill="none"
          stroke="#fff"
          stroke-width="2.25"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <script>
      (function () {
        var cue = document.getElementById("scroll-cue");
        if (!cue) return;
        function hide() {
          if (cue.classList.contains("is-gone")) return;
          cue.classList.add("is-gone");
          cue.addEventListener("animationend", function () {
            cue.remove();
          });
        }
        if (window.scrollY > 8) hide();
        else window.addEventListener("scroll", hide, { once: true, passive: true });
      })();
    </script>
    <script src="./config.js"></script>
    <script src="https://unpkg.com/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js"></script>
    <script src="./layers.js"></script>
    <script src="./story.js"></script>
    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.mjs";

      applyStory(config).then(function () {
        var initLoad = true;
        var layerTypes = {
          fill: ["fill-opacity"],
          line: ["line-opacity"],
          circle: ["circle-opacity", "circle-stroke-opacity"],
          symbol: ["icon-opacity", "text-opacity"],
          raster: ["raster-opacity"],
          "fill-extrusion": ["fill-extrusion-opacity"],
          heatmap: ["heatmap-opacity"],
        };

        var alignments = {
          left: "lefty",
          center: "centered",
          right: "righty",
          full: "fully",
        };

        function getLayerPaintType(layer) {
          var layerType = map.getLayer(layer).type;
          return layerTypes[layerType];
        }

        function setLayerOpacity(layer) {
          var paintProps = getLayerPaintType(layer.layer);
          paintProps.forEach(function (prop) {
            var options = {};
            if (layer.duration) {
              var transitionProp = prop + "-transition";
              options = { duration: layer.duration };
              map.setPaintProperty(layer.layer, transitionProp, options);
            }
            map.setPaintProperty(layer.layer, prop, layer.opacity, options);
          });
        }

        // Chapters list only what changed. Fold those changes from the start so
        // jumping straight to a chapter still shows every layer at the right opacity.
        const chapterLayers = config.chapters.map((_, index) => {
          const opacity = new Map();
          for (const chapter of config.chapters) {
            for (const update of chapter.onChapterEnter) {
              opacity.set(update.layer, { layer: update.layer, opacity: 0 });
            }
          }
          for (const chapter of config.chapters.slice(0, index + 1)) {
            for (const update of chapter.onChapterEnter) {
              opacity.set(update.layer, {
                layer: update.layer,
                opacity: update.opacity,
                ...(update.duration ? { duration: update.duration } : {}),
              });
            }
          }
          return [...opacity.values()];
        });

        // add navigation control for interactive chapters
        const navigation = new maplibregl.NavigationControl();

        // add custom hover popups for interactive chapters
        const popup = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
        });
        const popupHover = (e) => {
          map.getCanvas().style.cursor = "pointer";
          const coordinates = e.features[0].geometry.coordinates.slice();
          const description = e.features[0].properties.Community_;
          while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
          }
          popup.setLngLat(coordinates).setHTML(description).addTo(map);
        };
        const popupHoverAway = () => {
          popup.remove();
          map.getCanvas().style.cursor = "default";
        };
        const turnPopupsOn = (layer) => {
          map.on("mouseenter", layer, popupHover);
          map.on("mouseleave", layer, popupHoverAway);
        };
        const turnPopupsOff = (layer) => {
          map.off("mouseenter", layer, popupHover);
          map.off("mouseleave", layer, popupHoverAway);
        };

        var story = document.getElementById("story");
        var features = document.createElement("div");
        features.setAttribute("id", "features");

        var header = document.createElement("div");

        if (config.title) {
          var titleText = document.createElement("h1");
          titleText.innerText = config.title;
          header.appendChild(titleText);
        }

        if (config.subtitle) {
          var subtitleText = document.createElement("h2");
          subtitleText.innerText = config.subtitle;
          header.appendChild(subtitleText);
        }

        if (config.byline) {
          var bylineText = document.createElement("p");
          bylineText.innerText = config.byline;
          header.appendChild(bylineText);
        }

        // add logo if found in config
        if (config.logo) {
          var image = new Image();
          image.src = config.logo;
          header.appendChild(image);
        }

        var terrainTip = document.createElement("p");
        terrainTip.id = "terrain-tip";
        terrainTip.innerHTML =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" aria-hidden="true"><rect x="1.25" y="1.25" width="26.5" height="26.5" rx="4" fill="none" stroke="#fff" stroke-width="1.75"/><path fill="#fff" transform="translate(3.5 3.5)" d="m1.754 13.406 4.453-4.851 3.09 3.09 3.281 3.277.969-.969-3.309-3.312 3.844-4.121 6.148 6.886h1.082v-.855l-7.207-8.07-4.84 5.187L6.169 6.57l-5.48 5.965v.871ZM.688 16.844h20.625v1.375H.688Z"/></svg>Note: Click the button in the top-right corner to view the mountain in 3D.';
        header.appendChild(terrainTip);

        if (header.innerText.length > 0) {
          header.classList.add(config.theme);
          header.setAttribute("id", "header");
          story.appendChild(header);
        }

        config.chapters.forEach((record, idx) => {
          var container = document.createElement("div");
          var chapter = document.createElement("div");

          if (record.title) {
            var title = document.createElement("h3");
            title.innerText = record.title;
            chapter.appendChild(title);
          }

          if (record.image) {
            var image = new Image();
            image.src = record.image;
            chapter.appendChild(image);
          }

          // add image caption to chapters if found in config
          if (record.caption) {
            var caption = document.createElement("p");
            caption.setAttribute("class", "caption");
            caption.innerHTML = `<em>${record.caption}</em>`;
            chapter.appendChild(caption);
          }

          if (record.description) {
            var story = document.createElement("p");
            story.innerHTML = record.description;
            chapter.appendChild(story);

            // add author to chapters if found in config
            if (record.author) {
              var author = document.createElement("p");
              author.innerHTML = "<strong>By " + record.author + "</strong>";
              chapter.appendChild(author);
            }

            // add website to chapters if found in config
            if (record.website) {
              var website = document.createElement("p");
              website.innerHTML = `» ${record.website}`;
              chapter.appendChild(website);
            }

            // add return to top link to each chapter
            if (config.chapterReturn) {
              var returnTop = document.createElement("p");
              returnTop.setAttribute("class", "returntop");
              returnTop.innerHTML = '<a href="#header">Back to top</a>';
              chapter.appendChild(returnTop);
            }
          }

          // add legend to chapters if found in config
          if (record.legend) {
            var legend = document.createElement("div");
            legend.setAttribute("class", "legend");
            legend.setAttribute("id", record.id + "Legend");
            legend.innerHTML = "<div>" + record.legend + "</div>";
            document.body.append(legend);
          }

          container.setAttribute("id", record.id);
          container.classList.add("step");
          if (idx === 0) {
            container.classList.add("active");
          }

          chapter.classList.add(config.theme);
          container.appendChild(chapter);
          container.classList.add(alignments[record.alignment] || "centered");
          if (record.hidden) {
            container.classList.add("hidden");
          }
          features.appendChild(container);
        });

        story.appendChild(features);

        var footer = document.createElement("div");

        // add bookmarks for chapters with title, append to header and footer
        if (config.bookmarks) {
          var bookmarksText = "<strong>Bookmarks</strong>: ";
          for (var i = 0; i < config.chapters.length; i++) {
            if (config.chapters[i].title) {
              bookmarksText += `<a href=#${config.chapters[i].id}>${config.chapters[i].title}</a>`;
              if (i != config.chapters.length - 1) {
                bookmarksText += " | ";
              }
            }
          }
          var headerBookmarks = document.createElement("h5");
          headerBookmarks.innerHTML = bookmarksText;
          header.appendChild(headerBookmarks);
          var footerBookmarks = document.createElement("p");
          footerBookmarks.innerHTML = bookmarksText;
          footer.appendChild(footerBookmarks);
        }

        // add prefix content for mobile view
        if (config.mobileview) {
          header.insertAdjacentHTML("beforeend", config.mobileview);
        }

        if (config.footer) {
          var footerText = document.createElement("p");
          footerText.innerHTML = config.footer;
          footer.appendChild(footerText);
        }

        if (footer.innerText.length > 0) {
          footer.classList.add(config.theme);
          footer.setAttribute("id", "footer");
          story.appendChild(footer);
        }

        var map = new maplibregl.Map({
          container: "map",
          style: config.style,
          center: config.chapters[0].location.center,
          zoom: config.chapters[0].location.zoom,
          bearing: config.chapters[0].location.bearing,
          pitch: config.chapters[0].location.pitch,
          // make storymap partially interactive
          interactive: true,
          dragPan: false,
          dragRotate: false,
          doubleClickZoom: false,
          scrollZoom: false,
          touchZoomRotate: false,
          maxPitch: 85,
        });

        // Create a inset map if enabled in config.js
        if (config.inset && !config.legend) {
          var insetMap = new maplibregl.Map({
            container: "mapInset", // container id
            style: "https://tiles.openfreemap.org/styles/dark",
            center: config.chapters[0].location.center,
            // Hardcode above center value if you want insetMap to be static.
            zoom: 3, // starting zoom
            hash: false,
            interactive: false,
            attributionControl: false,
          });
        }

        if (config.showMarkers) {
          var marker = new maplibregl.Marker({ color: config.markerColor });
          marker.setLngLat(config.chapters[0].location.center).addTo(map);
        }

        // instantiate the scrollama
        var scroller = scrollama();

        function firstLabelLayerId() {
          const layers = map.getStyle().layers;
          const preferred = ["contour-label", "waterway_line_label"];
          for (const id of preferred) {
            if (layers.some((layer) => layer.id === id)) return id;
          }
          const label = layers.find(
            (layer) =>
              layer.type === "symbol" &&
              (layer.id.endsWith("-label") ||
                layer.id.endsWith("_label") ||
                layer.id.startsWith("label_")),
          );
          return label && label.id;
        }

        const terrainOptions = { source: "terrainSource", exaggeration: 3 }; // 3 exaggeration works well for Mount Elgon

        function addTerrainSource(map) {
          if (map.getSource(terrainOptions.source)) return;
          map.addSource(terrainOptions.source, {
            type: "raster-dem",
            url: "https://tiles.mapterhorn.com/tilejson.json",
            maxzoom: 12,
          });
        }

        function syncSky(map) {
          if (map.getTerrain()) {
            if (map.getLayer("sky")) return;
            map.addLayer({
              id: "sky",
              type: "sky",
              paint: {
                "sky-type": "atmosphere",
                "sky-atmosphere-sun": [0.0, 0.0],
                "sky-atmosphere-sun-intensity": 15,
              },
            });
            return;
          }
          if (map.getLayer("sky")) map.removeLayer("sky");
        }

        function addHillshade(map) {
          if (map.getSource("hillshade-dem")) return;
          map.addSource("hillshade-dem", {
            type: "raster-dem",
            url: "https://tiles.mapterhorn.com/tilejson.json",
            maxzoom: 12,
          });
          const beforeId = [
            "waterway_tunnel",
            "water",
            "tunnel_motorway_link_casing",
          ].find((id) => map.getLayer(id));
          map.addLayer(
            {
              id: "hillshade",
              type: "hillshade",
              source: "hillshade-dem",
              paint: {
                "hillshade-method": "standard",
                "hillshade-illumination-direction": 315,
                "hillshade-shadow-color": "#473B24",
                "hillshade-highlight-color": "#ffffff",
                "hillshade-accent-color": "#473B24",
                "hillshade-exaggeration": 0.5,
              },
            },
            beforeId,
          );
        }

        function addElgonPeak(map) {
          if (map.hasImage("elgon-peak")) return;
          const ratio = 2;
          const width = 40;
          const height = 32;
          const canvas = document.createElement("canvas");
          canvas.width = width * ratio;
          canvas.height = height * ratio;
          const ctx = canvas.getContext("2d");
          ctx.scale(ratio, ratio);
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(3, 28);
          ctx.lineTo(14, 11);
          ctx.lineTo(18, 17);
          ctx.lineTo(27, 4);
          ctx.lineTo(37, 28);
          ctx.closePath();
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
          ctx.fillStyle = "#6b4632";
          ctx.fill();
          map.addImage(
            "elgon-peak",
            ctx.getImageData(0, 0, canvas.width, canvas.height),
            { pixelRatio: ratio },
          );
        }

        map.on("load", async function () {
          addHillshade(map);
          addTerrainSource(map);
          if (config.use3dTerrain) {
            map.setTerrain(terrainOptions);
            map.dragRotate.enable();
          }
          syncSky(map);
          map.addControl(
            new maplibregl.TerrainControl(terrainOptions),
            "top-right",
          );
          map.on("terrain", () => {
            const enabled = !!map.getTerrain();
            syncSky(map);
            map.dragRotate[enabled ? "enable" : "disable"]();
            map.easeTo({
              pitch: enabled ? Math.max(map.getPitch(), 60) : 0,
              duration: 700,
            });
          });

          const storyData = await fetch(storyLayers.url).then((response) =>
            response.json(),
          );
          addElgonPeak(map);
          const labelLayerId = firstLabelLayerId();
          storyLayers.toMapLayers(storyData).forEach((layer) => {
            if (map.getLayer(layer.id)) map.removeLayer(layer.id);
            // Keep the mountain label above the basemap. Fills and lines sit
            // under the first place-name layer.
            const beforeId = layer.type === "symbol" ? undefined : labelLayerId;
            map.addLayer(layer, beforeId);
          });

          // As the map moves, grab and update bounds in inset map.
          if (config.inset && !config.legend) {
            map.on("move", getInsetBounds);
          }

          // setup the instance, pass callback functions
          scroller
            .setup({
              step: ".step",
              offset: 0.5,
              progress: true,
            })
            .onStepEnter(async (response) => {
              var chapter = config.chapters.find(
                (chap) => chap.id === response.element.id,
              );

              // add legend to each chapter
              for (var i = 0; i < config.chapters.length; i++) {
                if (config.chapters[i].legend != undefined) {
                  if (config.chapters[i].id == response.element.id) {
                    document.getElementById(
                      config.chapters[i].id + "Legend",
                    ).style.display = "block";
                  } else {
                    document.getElementById(
                      config.chapters[i].id + "Legend",
                    ).style.display = "none";
                  }
                }
              }

              response.element.classList.add("active");
              const location = map.getTerrain()
                ? {
                    ...chapter.location,
                    pitch: Math.max(chapter.location.pitch || 0, 60),
                  }
                : chapter.location;
              map[chapter.mapAnimation || "flyTo"](location);
              // Incase you do not want to have a dynamic inset map,
              // rather want to keep it a static view but still change the
              // bbox as main map move: comment out the below if section.
              if (config.inset && !config.legend) {
                if (chapter.location.zoom < 5) {
                  insetMap.flyTo({ center: chapter.location.center, zoom: 0 });
                } else {
                  insetMap.flyTo({ center: chapter.location.center, zoom: 3 });
                }
              }
              if (config.showMarkers) {
                marker.setLngLat(chapter.location.center);
              }
              const chapterIndex = config.chapters.indexOf(chapter);
              if (chapterIndex !== -1) {
                chapterLayers[chapterIndex].forEach(setLayerOpacity);
              }

              // set interactive properties for chapters set as mapInteractive = true
              if (chapter.mapInteractive) {
                map.addControl(navigation);
                map.dragPan.enable();
                map.doubleClickZoom.enable();
                map.getCanvas().style.cursor = "grab";
              } else {
                if (map.hasControl(navigation)) {
                  map.removeControl(navigation);
                }
                map.dragPan.disable();
                map.doubleClickZoom.disable();
                map.getCanvas().style.cursor = "default";
              }
              if (chapter.callback) {
                window[chapter.callback]();
              }
              if (chapter.rotateAnimation) {
                map.once("moveend", () => {
                  const rotateNumber = map.getBearing();
                  map.rotateTo(rotateNumber + 180, {
                    duration: 30000,
                    easing: function (t) {
                      return t;
                    },
                  });
                });
              }

              if (chapter.spinGlobe) {
                map.once("moveend", () => {
                  const center = map.getCenter();
                  const newCenter = [center.lng + 360, center.lat];
                  map.easeTo({
                    center: newCenter,
                    duration: 20000,
                    easing: (n) => n,
                  });
                });
              }
            })
            .onStepExit((response) => {
              var chapter = config.chapters.find(
                (chap) => chap.id === response.element.id,
              );
              response.element.classList.remove("active");
              if (chapter.onChapterExit.length > 0) {
                chapter.onChapterExit.forEach(setLayerOpacity);
              }
            });
        });

        //Helper functions for insetmap
        function getInsetBounds() {
          let bounds = map.getBounds();
          let sw = bounds.getSouthWest();
          let ne = bounds.getNorthEast();

          let boundsJson = {
            type: "FeatureCollection",
            features: [
              {
                type: "Feature",
                properties: {},
                geometry: {
                  type: "Polygon",
                  coordinates: [
                    [
                      [sw.lng, sw.lat],
                      [ne.lng, sw.lat],
                      [ne.lng, ne.lat],
                      [sw.lng, ne.lat],
                      [sw.lng, sw.lat],
                    ],
                  ],
                },
              },
            ],
          };

          if (initLoad) {
            addInsetLayer(boundsJson);
            initLoad = false;
          } else {
            updateInsetLayer(boundsJson);
          }
        }

        function addInsetLayer(bounds) {
          insetMap.addSource("boundsSource", {
            type: "geojson",
            data: bounds,
          });

          insetMap.addLayer({
            id: "boundsLayer",
            type: "fill",
            source: "boundsSource", // reference the data source
            layout: {},
            paint: {
              "fill-color": "#fff", // blue color fill
              "fill-opacity": 0.2,
            },
          });
          // // Add a black outline around the polygon.
          insetMap.addLayer({
            id: "outlineLayer",
            type: "line",
            source: "boundsSource",
            layout: {},
            paint: {
              "line-color": "#000",
              "line-width": 1,
            },
          });
        }

        function updateInsetLayer(bounds) {
          insetMap.getSource("boundsSource").setData(bounds);
        }

        // setup resize event
        window.addEventListener("resize", scroller.resize);
      });
    </script>
  </body>
</html>
